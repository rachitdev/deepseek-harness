# Real Loader composition proving the recall filter screens recall appended by a
# memory plugin that is listed (and applied) after decision-consumers.
- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: sessions
  name: '@deepseek-ai/dsh-session'

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'

- id: tools
  name: '@deepseek-ai/dsh-tools'

- id: agents
  name: '@deepseek-ai/dsh-agent'

- id: decision
  name: '@deepseek-ai/dsh-decision'

- id: decision-consumers
  name: '@deepseek-ai/dsh-decision-consumers'
  config:
    recallFilter:
      enabled: true
      minRelevance: 0.5
      injectionThreshold: 0.7
      batchSize: 2
      timeoutMs: 2000

- id: recall-fixture-runtime
  name: ./fixture-runtime.ts

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
